<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <title>핏체크</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <h1>핏체크</h1>
    <p class="hint">키·몸무게만 넣어도 비슷한 체형 후기로 추천해요. 이 브라우저에만 저장돼요.</p>
    <form id="form" novalidate>
      <fieldset>
        <legend>성별</legend>
        <label><input type="radio" name="gender" value="male" /> 남성</label>
        <label><input type="radio" name="gender" value="female" /> 여성</label>
      </fieldset>
      <div class="two">
        <label>키 (cm)<input name="height" type="number" inputmode="decimal" min="130" max="220" /></label>
        <label>몸무게 (kg)<input name="weight" type="number" inputmode="decimal" min="30" max="200" /></label>
      </div>
      <label>선호 핏
        <select name="preferredFit">
          <option value="slim">슬림</option>
          <option value="regular" selected>레귤러</option>
          <option value="relaxed">여유</option>
        </select>
      </label>
      <details>
        <summary>직접 잰 치수 <span class="opt">선택 · 넣으면 더 자세해요</span></summary>
        <p class="hint sub">비워 둔 치수는 키·몸무게와 비슷한 체형 후기로 추정해요.</p>
        <div class="two">
          <label>어깨너비<input name="m-shoulder" type="number" inputmode="decimal" /></label>
          <label>가슴둘레<input name="m-chest" type="number" inputmode="decimal" /></label>
          <label>허리둘레<input name="m-waist" type="number" inputmode="decimal" /></label>
          <label>엉덩이둘레<input name="m-hip" type="number" inputmode="decimal" /></label>
          <label>허벅지둘레<input name="m-thigh" type="number" inputmode="decimal" /></label>
          <label>발길이(mm)<input name="m-footLength" type="number" inputmode="decimal" /></label>
          <label>발볼
            <select name="footWidth">
              <option value="" selected>모름</option>
              <option value="narrow">좁은 편</option>
              <option value="normal">보통</option>
              <option value="wide">넓은 편</option>
            </select>
          </label>
        </div>
      </details>
      <button type="submit" class="secondary">체형 정보 저장</button>
    </form>
    <button id="run" type="button" class="primary">이 페이지에서 내 사이즈 찾기</button>
    <p id="status" role="status" aria-live="polite"></p>
    <script src="popup.js"></script>
  </body>
</html>
